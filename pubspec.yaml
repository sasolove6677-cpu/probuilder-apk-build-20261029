name: pro_builder
description: Pro Builder — HTML-to-APK customization studio starter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/launcher_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/launcher_icon.png
  adaptive_icon_background: '#0A0A0A'
  adaptive_icon_foreground: assets/launcher_icon.png
